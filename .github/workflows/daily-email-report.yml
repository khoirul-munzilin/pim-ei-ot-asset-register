name: Daily and Manual Asset Email Report

on:
  schedule:
    # GitHub Actions menggunakan UTC.
    # 00:00 UTC sama dengan 07:00 WIB.
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      recipient:
        description: 'Email penerima, kosongkan untuk memakai REPORT_TO'
        required: false
        type: string

      area_group:
        description: 'Filter Area, opsional'
        required: false
        type: string

      functional_location:
        description: 'Filter Functional Location, opsional'
        required: false
        type: string

      category:
        description: 'Filter Category, opsional'
        required: false
        type: string

  repository_dispatch:
    types:
      - manual-asset-report

concurrency:
  group: asset-email-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-report:
    name: Generate and send asset report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Generate and send report
        run: npm run report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}

          REPORT_TO: ${{ secrets.REPORT_TO }}

          REPORT_RECIPIENT: ${{ github.event.client_payload.recipient || inputs.recipient || secrets.REPORT_TO }}
          REPORT_AREA: ${{ github.event.client_payload.area_group || inputs.area_group || '' }}
          REPORT_FUNLOC: ${{ github.event.client_payload.functional_location || inputs.functional_location || '' }}
          REPORT_CATEGORY: ${{ github.event.client_payload.category || inputs.category || '' }}
