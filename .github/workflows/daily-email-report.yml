/* ============================================================
   BUAT LAMPIRAN CSV
   ============================================================ */

const csvColumns = [
  "category",
  "tagname",
  "functional_location",
  "equipment_no",
  "plant_area",
  "area_group",
  "brand",
  "model",
  "condition",
  "status",
  "remark"
];

const csvRows = [
  csvColumns.map(csvCell).join(";")
];

for (const asset of assets) {
  const row = csvColumns.map(
    (columnName) => {
      let cellValue =
        asset[columnName];

      if (
        columnName ===
        "equipment_no"
      ) {
        cellValue =
          asset.equipment_no ||
          asset.equipment_number ||
          "";
      }

      if (
        columnName ===
        "remark"
      ) {
        cellValue =
          asset.remark ||
          asset.remarks ||
          "";
      }

      return csvCell(cellValue);
    }
  );

  csvRows.push(
    row.join(";")
  );
}

const csvText =
  "\ufeff" +
  csvRows.join("\n");


/* ============================================================
