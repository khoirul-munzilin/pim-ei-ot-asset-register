/* ============================================================
   FUNGSI DOWNLOAD DATA SUPABASE
   ============================================================ */

async function fetchAllRows(
  tableName,
  filters = {}
) {
  const allRows = [];
  let offset = 0;
  const limit = 1000;

  while (true) {
    const params = new URLSearchParams({
      select: "*",
      offset: String(offset),
      limit: String(limit)
    });

    for (const [column, filterValue] of
      Object.entries(filters)) {

      if (filterValue) {
        params.set(
          column,
          `eq.${filterValue}`
        );
      }
    }

    const url =
      `${SUPABASE_URL}/rest/v1/` +
      `${tableName}?${params.toString()}`;

    const response = await fetch(url, {
      headers: {
        apikey:
          SUPABASE_SERVICE_ROLE_KEY,

        Authorization:
          `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`
      }
    });

    if (!response.ok) {
      const errorText =
        await response.text();

      throw new Error(
        `Gagal membaca tabel ${tableName}: ` +
        `${response.status} ${errorText}`
      );
    }

    const rows =
      await response.json();

    allRows.push(...rows);

    if (rows.length < limit) {
      break;
    }

    offset += limit;
  }

  return allRows;
}


/* ============================================================
   FORMAT DATA
   ============================================================ */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[character]
    );
}


function csvCell(value) {
  return (
    "\"" +
    String(value ?? "")
      .replace(/"/g, "\"\"") +
    "\""
  );
}


function formatDateJakarta(date) {
  return new Intl.DateTimeFormat(
    "id-ID",
    {
      timeZone: "Asia/Jakarta",
      dateStyle: "full",
      timeStyle: "short"
    }
  ).format(date);
}


function formatShortDateJakarta(date) {
  return new Intl.DateTimeFormat(
    "id-ID",
    {
      timeZone: "Asia/Jakarta",
      dateStyle: "medium"
    }
  ).format(date);
}


