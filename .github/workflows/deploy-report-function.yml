name: Deploy Report Trigger Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/trigger-asset-report/**"
      - "supabase/config.toml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REPORT_GITHUB_PAT: ${{ secrets.REPORT_GITHUB_PAT }}
        run: |
          supabase secrets set \
            REPORT_GITHUB_PAT="$REPORT_GITHUB_PAT" \
            REPORT_GITHUB_OWNER="khoirul-munzilin" \
            REPORT_GITHUB_REPO="pim-ei-ot-asset-register" \
            --project-ref "$PROJECT_REF"

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy trigger-asset-report \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
